<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🐣 Chicken Math</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Arial Rounded MT Bold',sans-serif;background:#f9efd9;color:#65452c}#app{max-width:1250px;margin:auto;padding:10px}header{height:56px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:22px}button{border:0;border-radius:18px;background:#f6b858;color:#644224;padding:12px 22px;font-weight:900;font-size:20px;cursor:pointer;box-shadow:0 4px #d99142}button:active{transform:translateY(3px);box-shadow:0 1px #d99142}.game{display:flex;gap:10px;height:min(60vh,560px);min-height:300px}.side{width:108px;background:#fff9e9;border-radius:24px;text-align:center;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:10px}.side strong{font-size:23px}.track{flex:1;width:35px;border-radius:22px;background:#eee3d0;overflow:hidden;position:relative;border:4px solid white}.fill{position:absolute;bottom:0;width:100%;height:0;background:linear-gradient(#ffe47c,#ffb94d);transition:height .5s}.farm{flex:1;position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(#a8d8f4 0 53%,#b9dd8b 53% 100%);box-shadow:inset 0 -20px 0 #a4ce77}.farm:before{content:'☁️　　 ☁️　　 ☀️';position:absolute;top:18px;left:15%;font-size:35px;opacity:.9}.hill{position:absolute;bottom:30%;left:-5%;width:110%;height:26%;background:#9bcc85;border-radius:50% 50% 0 0}.deco{position:absolute;font-size:38px;pointer-events:none}.coop{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:175px;height:155px;z-index:3}.roof{position:absolute;top:0;left:0;width:100%;height:66px;background:#c56849;clip-path:polygon(50% 0,100% 90%,93% 100%,7% 100%,0 90%);filter:drop-shadow(0 3px #8f4c35)}.house{position:absolute;top:57px;left:19px;width:137px;height:94px;border-radius:8px;background:#e9b579;border:6px so lid #f3ca81;border-radius:32px;padding:22px;box-shadow:0 12px 40px #0003}.egg{font-size:85px;filter:drop-shadow(0 5px 4px #0002)}.modal h1{font-size:34px;margin:8px}.modal p{font-size:20px}.mini{font-size:16px;color:#98785d}.collection{cursor:pointer;font-size:23px}.theme2 .farm{background:linear-gradient(#b7e6fb 0 53%,#a7db9a 53%)}.theme3 .farm{background:linear-gradient(#a6dcff 0 53%,#d2d77c 53%)}.theme4 .farm{background:linear-gradient(#c6e6ff 0 53%,#a3d17f 53%)}.theme5 .farm{background:linear-gradient(#8bd2e8 0 53%,#8fcaab 53%)}.theme6 .farm{background:linear-gradient(#e8c9a5 0 53%,#d4a16e 53%)}.theme7 .farm{background:linear-gradient(#f5d4a3 0 53%,#d5a36e 53%)}.theme8 .farm{background:linear-gradient(#c6e9f7 0 53%,#e7f3f5 53%)}.theme9 .farm{background:linear-gradient(#f8d8ea 0 53%,#b7d89a 53%)}.theme10 .farm{background:linear-gradient(#a6d4fb 0 53%,#d3d99d 53%)}@media(max-width:600px){header{font-size:16px}.game{height:52vh;min-height:270px}.side{width:70px;padding:10px 4px}.side strong{font-size:17px}.coop{scale:.75}.controls{gap:8px}.writing canvas{width:145px;height:90px}.actions button{padding:9px 12px;font-size:16px}.chick{scale:.8}}.choices{display:flex;gap:18px;justify-content:center;align-items:center;margin:10px auto 18px;width:min(95%,680px)}.choice{flex:1;min-height:94px;border:4px solid #fff;border-radius:24px;background:#fff2b5;box-shadow:0 7px 0 #d6b878;font-size:clamp(36px,5vw,64px);font-weight:900;color:#76502d;cursor:pointer;touch-action:manipulation}.choice:nth-child(2){background:#d8f0d1;box-shadow:0 7px 0 #a2c9a0}.choice:nth-child(3){background:#d9e9ff;box-shadow:0 7px 0 #a5bfdf}.choice:active{transform:translateY(5px);box-shadow:none}.choice:disabled{opacity:.65;cursor:default}.controls{min-height:unset!important}.equation{margin-bottom:10px} .chick .egg-shell{display:none;position:absolute;inset:-4px;font-size:45px;text-align:center;animation:eggWobble .55s ease-in-out infinite alternate}.chick.egg-stage .egg-shell{display:block}.chick.egg-stage .tuft,.chick.egg-stage .body,.chick.egg-stage .eyes,.chick.egg-stage .beak,.chick.egg-stage .feet{display:none}.chick .hen-comb,.chick .hen-tail{display:none}.chick.grown{width:68px;height:66px}.chick.grown .body{width:53px;height:48px;background:var(--feather);border-radius:52% 50% 42% 45%;left:7px;top:14px}.chick.grown .eyes{top:29px;left:21px}.chick.grown .beak{top:38px;left:29px}.chick.grown .feet{left:19px}.chick.grown .tuft{display:none}.chick.grown .hen-comb{display:block;position:absolute;top:2px;left:22px;width:26px;height:17px;background:#d74748;border-radius:65% 65% 15% 15%;clip-path:polygon(0 100%,0 45%,14% 45%,18% 0,37% 28%,54% 0,70% 30%,88% 8%,100% 65%,100% 100%)}.chick.grown .hen-tail{display:block;position:absolute;top:18px;right:-4px;color:var(--feather);font-size:27px}@keyframes eggWobble{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}  .help-panel{position:fixed;inset:0;background:#493827a8;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:18px;text-align:center}.help-panel[hidden]{display:none!important}.help-panel>div,.help-panel>button{max-width:min(92vw,580px)}#helpTitle{background:#fff9e9;border-radius:24px;padding:16px 24px;font-size:clamp(21px,3vw,31px);font-weight:900;color:#674329}.help-visual{background:#fff9e9;border-radius:25px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;font-size:clamp(19px,3vw,28px);font-weight:800}.counter-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:450px}.counter-row span{font-size:clamp(22px,4vw,38px)}.counter-row .removed{opacity:.22;text-decoration:line-through}.help-panel button{font-size:25px;background:#f6b858;padding:17px 32px}  .chicken-demo{padding:10px;text-align:center;font-size:25px;font-weight:800}.demo-birds{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:22px auto;min-height:85px;max-width:580px}.demo-bird{display:inline-block;font-size:46px;transition:transform 1.1s ease-in,opacity 1.1s}.demo-bird.leaving{transform:translate(500px,-110px) rotate(30deg);opacity:0}.demo-bird.not-arrived{transform:translate(-400px,30px);opacity:0}#demoQuestion{font-size:27px;color:#7a492c;margin:15px} .chick:not(.grown):not(.egg-stage){transform:scale(.72);transform-origin:center bottom}.chick:not(.grown):not(.egg-stage).flip{transform:scale(-.72,.72)} 
.modal{width:min(720px,100%);max-height:94vh;overflow:auto}
.map-heading{font-weight:900;font-size:20px;margin:14px 0 10px}
.map-road{position:relative;display:flex;justify-content:space-between;align-items:center;gap:2px;background:linear-gradient(90deg,#b5dd97,#e7d4a0);padding:32px 8px 43px;border-radius:20px;min-height:118px;overflow:hidden}
.map-road:before{content:"";position:absolute;left:6%;right:6%;top:51px;height:8px;border-radius:20px;background:#eac78e;border:2px dashed #c89863}
.map-node{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:900;color:#65452c}
.map-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#fff4d6;border:3px solid #b7a18a;font-size:18px}
.map-node.done .map-icon{background:#d4efb4;border-color:#79ad58}
.map-node.current .map-icon{background:#ffe084;border-color:#f0a33c}
.map-node.locked{opacity:.68}
.map-traveler{position:absolute;top:0;z-index:3;font-size:30px;transform:translateX(-50%);transition:left 1.1s ease-in-out;filter:drop-shadow(0 2px 2px #0003);pointer-events:none}
.map-end{text-align:right;font-size:12px;font-weight:900;color:#9b7846;margin:4px 6px 14px}
#next:disabled{opacity:.55;cursor:wait}
@media(max-width:540px){.map-icon{width:25px;height:25px;font-size:13px;border-width:2px}.map-node{font-size:11px}.map-road{padding-left:3px;padding-right:3px}}
</style></head><body><div id="app"><header><span>🐣 Chicken Math</span><span id="levelTitle">Level 1 · Spring Meadow</span><span class="collection" id="collection" title="Egg Collection">🥚 0/10</span></header><div class="game"><aside class="side"><div style="font-size:35px">🐥</div><strong id="count">0 / 10</strong><div class="track"><div class="fill" id="fill"></div></div><span>GOAL <b id="goal">10</b></span></aside><div class="farm" id="farm"><div class="hill"></div><div class="deco" style="left:8%;top:52%">🌳</div><div class="deco" style="right:9%;top:59%">🌼</div><div class="deco" style="left:25%;bottom:8%">🌷</div><div class="coop" id="coop"><div class="roof" id="roof"></div><div class="house" id="house"><div class="sign">🐣 COOP</div><div class="door"></div></div></div></div></div><div class="controls"><div class="equation" id="question">2 + 3 = ?</div><div class="choices" id="choices" aria-label="Choose an answer"></div></div><div class="msg" id="msg">Choose the correct answer!</div><div id="helpPanel" class="help-panel" hidden><div id="helpTitle"></div><div id="helpVisual" class="help-visual"></div><button id="retry" type="button">Try Again ↻</button></div></div><div id="overlay"><div class="modal" id="modal"></div></div><script>
const levels=[['Spring Meadow',10,'#ffdc60','#c56849','🥚','🌳','🌷'],['Flower Garden',12,'#ffe09c','#dd8eaa','🩷','🌸','🌺'],['Sunflower Farm',15,'#ffbe48','#e3a44d','💛','🌻','🌻'],['Apple Orchard',18,'#b98b5b','#c44d42','💚','🌳','🍎'],['Lakeside Farm',20,'#f7f6e9','#5796ba','💙','🌊','🪷'],['Autumn Forest',22,'#e9cb80','#b67c4e','🥚','🍄','🍁'],['Pumpkin Farm',25,'#f9a64d','#da7c38','🧡','🎃','🌾'],['Snowy Farm',28,'#fffaf4','#8db4ce','🤍','❄️','⛄'],['Cherry Blossom Farm',30,'#f4b8d0','#cc86a5','🩷','🌸','🌸'],['Rainbow Farm',35,'#d8c8f9','#9b83d4','🌈','🌈','✨']];
let level=Math.min(+(localStorage.getItem('chickenLevel')||0),9),collected=+(localStorage.getItem('chickenEggs')||0),count=0,answer=0,busy=false,chicks=[],lastQuestion='',audio;const $=id=>document.getElementById(id),farm=$('farm');
function sound(freq=650,dur=.12,type='sine',volume=.045){try{audio??=new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(90,freq*.68),audio.currentTime+dur);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function cluck(){sound(430,.18,'sawtooth',.025);setTimeout(()=>sound(350,.2,'triangle',.035),150);setTimeout(()=>sound(400,.17,'triangle',.025),320)}
function chirp(){sound(1000+Math.random()*400,.09,'sine',.027);setTimeout(()=>sound(1250+Math.random()*300,.08,'sine',.023),65)}
function update(){let goal=levels[level][1];$('count').textContent=count+' / '+goal;$('goal').textContent=goal;$('fill').style.height=Math.min(100,count/goal*100)+'%';$('collection').textContent='🥚 '+collected+'/10'}
function renderChoices(){const values=new Set([answer]);while(values.size<3){let n=Math.max(0,Math.min(10,answer+(Math.floor(Math.random()*9)-4)));values.add(n)}const arr=[...values].sort(()=>Math.random()-.5);$('choices').innerHTML='';for(const n of arr){const button=document.createElement('button');button.className='choice';button.textContent=n;button.onclick=()=>submit(n);$('choices').appendChild(button)}}
let mistakes=0,currentA=0,currentB=0,currentOp="+",needsCorrectClick=false;
function newQuestion(){
 mistakes=0;needsCorrectClick=false;
 let a,b,key,max=level<2?5:10;
 for(let i=0;i<120;i++){
   a=1+Math.floor(Math.random()*max);
   b=Math.floor(Math.random()*(a+1));
   if(level<2 && b===0)continue;
   if(level>=2 && level<5 && b===0)continue;
   if(level>=5 && level<8 && (a-b>5 || b<2))continue;
   if(level>=8 && a<7)continue;
   key=`${a}-${b}`;if(key!==lastQuestion)break;
 }
 lastQuestion=key;currentA=a;currentB=b;currentOp='-';answer=a-b;
 $('question').textContent=`${a} − ${b} = ?`;
 renderChoices();$('msg').textContent='Choose the correct answer!';
}
function makeChick(){let el=document.createElement('div');el.className='chick egg-stage';let col=levels[level][2];if(level===9)col=['#f4c3d9','#d9d3ff','#ffe8a3','#bce9d5'][Math.floor(Math.random()*4)];el.style.setProperty('--feather',col);el.innerHTML='<span class="egg-shell">🥚</span><span class="tuft">⌃</span><span class="body"></span><span class="eyes">••</span><span class="beak"></span><span class="feet">⌁</span><span class="hen-comb"></span><span class="hen-tail">◕</span>';farm.appendChild(el);let w=farm.clientWidth,h=farm.clientHeight;let x=20,y=h*.7;let best=-1;for(let k=0;k<120;k++){let cx=12+Math.random()*Math.max(1,w-85),cy=h*.60+Math.random()*Math.max(1,h*.32-60);let distance=chicks.reduce((m,c)=>Math.min(m,Math.hypot(cx-c.x,cy-c.y)),Infinity);if(distance>best){best=distance;x=cx;y=cy}if(distance>=70)break;}let chick={el,x,y,tx:x,ty:y,speed:24+Math.random()*28,wait:0,stage:'egg'};chicks.push(chick);moveTarget(chick);setTimeout(()=>{if(!el.isConnected)return;chick.stage='chick';el.classList.remove('egg-stage');el.classList.add('hatched');chirp();setTimeout(()=>{if(!el.isConnected)return;chick.stage='hen';el.classList.add('grown');cluck()},5200+Math.random()*2200)},2100+Math.random()*1400);return chick}
function moveTarget(c){let w=farm.clientWidth,h=farm.clientHeight;for(let k=0;k<25;k++){let x=20+Math.random()*(w-75),y=h*.62+Math.random()*(h*.34-42);if(Math.abs(x-w*.5)<110&&y<h*.73)continue;c.tx=x;c.ty=y;break}}
let last=performance.now();function animate(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!$('overlay').style.display.includes('flex') && $('helpPanel').hidden)for(let c of chicks){if(c.stage==='egg'){c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';continue}if(c.wait>0){c.wait-=dt;c.el.classList.remove('walk')}else{let dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);if(d<5){c.wait=.5+Math.random()*2.5;moveTarget(c)}else{c.x+=dx/d*c.speed*dt;c.y+=dy/d*c.speed*dt;c.el.classList.add('walk');c.el.classList.toggle('flip',dx<0)}}c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';c.el.style.zIndex=5+Math.floor(c.y/10)}requestAnimationFrame(animate)}requestAnimationFrame(animate);
function showMathHelp(){
 const panel=$('helpPanel'),title=$('helpTitle'),visual=$('helpVisual');
 panel.hidden=false;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
 title.textContent='🐥 Watch the chicks and count!';
 const total=currentOp==='+'?currentA+currentB:currentA;
 visual.innerHTML='<div class="chicken-demo"><div id="demoLabel">First, there are '+currentA+' chicks</div><div class="demo-birds">'+Array.from({length:total},(_,i)=>'<span class="demo-bird" style="--i:'+i+'">🐥</span>').join('')+'</div><div id="demoQuestion"></div></div>';
 const birds=[...visual.querySelectorAll('.demo-bird')],label=visual.querySelector('#demoLabel'),question=visual.querySelector('#demoQuestion');
 $('retry').disabled=true;$('retry').textContent='Watch the animation first';
 if(currentOp==='−'||currentOp==='-'){
   setTimeout(()=>{if(!panel.hidden){label.textContent=currentB+' chicks walk away...';birds.slice(-currentB).forEach((b,i)=>{setTimeout(()=>b.classList.add('leaving'),i*250)})}},1100);
   setTimeout(()=>{if(!panel.hidden){question.textContent='How many chicks are left?';$('retry').disabled=false;$('retry').textContent='Try Again ↻'}},2600+currentB*250);
 }else{
   birds.slice(currentA).forEach(b=>b.classList.add('not-arrived'));
   setTimeout(()=>{if(!panel.hidden){label.textContent='Here come '+currentB+' more chicks...';birds.slice(currentA).forEach((b,i)=>setTimeout(()=>b.classList.remove('not-arrived'),i*230))}},1100);
   setTimeout(()=>{if(!panel.hidden){question.textContent='How many chicks are there now?';$('retry').disabled=false;$('retry').textContent='Try Again ↻'}},2600+currentB*230);
 }
 $('msg').textContent='⏸ 看完小鸡演示，再Choose an answer！';
}
$('retry').onclick=()=>{ $('helpPanel').hidden=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=false);if(mistakes>=3){needsCorrectClick=true;$('msg').textContent='Please choose the correct answer: '+answer+' ✓'}else $('msg').textContent='Try again! 🐣'};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function submit(selected){if(busy || !$('helpPanel').hidden)return;if(selected!==answer){mistakes++;sound(320,.16);showMathHelp();return}busy=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('msg').textContent=`Great job! +${answer} eggs 🥚`;sound(740,.14);await sleep(250);$('coop').classList.add('open');await sleep(320);for(let i=0;i<answer;i++){makeChick();count++;update();await sleep(180)}if(answer===0){$('msg').textContent='Great job! Zero eggs this time! 🐣';chirp();await sleep(600)}$('coop').classList.remove('open');await sleep(450);if(count>=levels[level][1])victory();else{newQuestion();busy=false}}
function mapMarkup(){
 let nodes=levels.map((l,i)=>{
   let status=i<level?'done':i===level?'current':'locked';
   return `<div class="map-node ${status}" data-stop="${i}"><span class="map-icon">${i<level?'⭐':i===level?'🏁':'🥚'}</span><span>${i+1}</span></div>`;
 }).join('');
 return `<div class="map-heading">🗺️ Farm Adventure Map</div><div class="map-road">${nodes}<div class="map-traveler" id="mapTraveler">🐔</div></div><div class="map-end">🏆 FINISH LINE</div>`;
}
function victory(){
 collected=Math.max(collected,level+1);
 localStorage.setItem('chickenEggs',collected);
 localStorage.setItem('chickenLevel',Math.min(level+1,9));
 update();
 for(let i=0;i<5;i++)setTimeout(()=>sound(520+i*125,.2,'sine',.07),i*130);
 $('modal').innerHTML=`<h1>🎉 Level Complete!</h1><div class="egg">${levels[level][4]}</div><h2>You earned a special egg!</h2><p>🥚 ${count} / ${levels[level][1]} eggs</p>${mapMarkup()}<button id="next" disabled>${level===9?'🏆 Adventure Complete! Play Again':'🐔 Travel to Next Farm ➜'}</button>`;
 $('overlay').style.display='flex';
 const traveler=$('mapTraveler'),road=$('modal').querySelector('.map-road');
 function moveTo(i){let node=road.querySelector('[data-stop="'+i+'"]');if(node)traveler.style.left=(node.offsetLeft+node.offsetWidth/2)+'px'}
 requestAnimationFrame(()=>{moveTo(Math.max(0,level-1));setTimeout(()=>{moveTo(level);setTimeout(()=>{$('next').disabled=false},900)},350)});
 $('next').onclick=()=>{level=level===9?0:level+1;start()};
}
function start(){count=0;busy=false;for(let c of chicks)c.el.remove();chicks=[];$('overlay').style.display='none';$('app').className='theme'+(level+1);$('levelTitle').textContent=`Level ${level+1} · ${levels[level][0]}`;$('roof').style.background=levels[level][3];$('house').style.background=level===7?'#dcecf2':level===6?'#eda36c':level===9?'#d9b6e5':'#e9b579';farm.querySelectorAll('.deco').forEach((e,i)=>e.textContent=levels[level][5+i%2]);update();newQuestion()}
$('collection').onclick=()=>{let eggs=levels.map((l,i)=>i<collected?l[4]:'🔒').join('　');$('modal').innerHTML=`<h1>🥚 Egg Collection</h1><p style="line-height:2.4;font-size:27px">${eggs}</p><p class="mini">Collected: ${collected} / 10</p><button id="close">Back to Farm</button>`;$('overlay').style.display='flex';$('close').onclick=()=>$('overlay').style.display='none'};
start();
</script></body></html>

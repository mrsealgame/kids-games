let level=Math.min(+(localStorage.getItem('chickenLevel')||0),19),collected=+(localStorage.getItem('chickenCompletedLevels')||0),count=0,answer=0,busy=false,chicks=[],lastQuestion='',audio;const $=id=>document.getElementById(id),farm=$('farm');
function sound(freq=650,dur=.12,type='sine',volume=.045){try{audio??=new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(90,freq*.68),audio.currentTime+dur);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}

let audioReady=false;
function getAudio(){
 try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();audioReady=true;return audio}catch(e){return null}
}
function animalTone(ctx,at,freq,duration,volume,wave='sine',endFreq=freq){
 const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=wave;
 osc.frequency.setValueAtTime(freq,at);osc.frequency.exponentialRampToValueAtTime(Math.max(40,endFreq),at+duration);
 gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(volume,at+.018);
 gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
 osc.connect(gain);gain.connect(ctx.destination);osc.start(at);osc.stop(at+duration+.01);
}
function playAnimal(kind){
 const ctx=getAudio();if(!ctx)return;
 const t=ctx.currentTime+.02;
 if(kind==='chick'){
  for(let i=0;i<3;i++){const f=1650+Math.random()*250;animalTone(ctx,t+i*.19,f,.14,.16,'sine',f*.65);animalTone(ctx,t+i*.19,f*.52,.12,.045,'triangle',f*.45)}

  // Avoid the loud sawtooth notes that made the previous hen sound electronic.

  for(const [i,offset] of pulses.entries()){
   const duration=.105+(i%3)*.026, at=t+offset;
   const length=Math.ceil(ctx.sampleRate*duration),buffer=ctx.createBuffer(1,length,ctx.sampleRate);
   const data=buffer.getChannelData(0);

   noise.connect(filter).connect(gain).connect(ctx.destination);noise.start(at);noise.stop(at+duration);

let nextFarmCall=performance.now()+3000;

 const now=performance.now();

function makeChick(){let el=document.createElement('div');el.className='chick egg-stage';let col=levels[level][2];if(level===19)col=['#f4c3d9','#d9d3ff','#ffe8a3','#bce9d5'][Math.floor(Math.random()*4)];el.style.setProperty('--feather',col);el.innerHTML='<span class="egg-shell">🥚</span><span class="tuft">⌃</span><span class="body"></span><span class="eyes">••</span><span class="beak"></span><span class="feet">⌁</span><span class="hen-comb"></span><span class="hen-tail">◕</span>';farm.appendChild(el);let w=farm.clientWidth,h=farm.clientHeight;let x=20,y=h*.7;let best=-1;for(let k=0;k<120;k++){let cx=12+Math.random()*Math.max(1,w-85),cy=h*.60+Math.random()*Math.max(1,h*.32-60);let distance=chicks.reduce((m,c)=>Math.min(m,Math.hypot(cx-c.x,cy-c.y)),Infinity);if(distance>best){best=distance;x=cx;y=cy}if(distance>=70)break;}let chick={el,x,y,tx:x,ty:y,speed:24+Math.random()*28,wait:0,stage:'egg'};chicks.push(chick);moveTarget(chick);setTimeout(()=>{if(!el.isConnected)return;chick.stage='chick';el.classList.remove('egg-stage');el.classList.add('hatched');chirp();setTimeout(()=>{if(!el.isConnected)return;chick.stage='hen';el.classList.add('grown');cluck()},5200+Math.random()*2200)},2100+Math.random()*1400);return chick}
function moveTarget(c){let w=farm.clientWidth,h=farm.clientHeight;for(let k=0;k<25;k++){let x=20+Math.random()*(w-75),y=h*.62+Math.random()*(h*.34-42);if(Math.abs(x-w*.5)<110&&y<h*.73)continue;c.tx=x;c.ty=y;break}}
let last=performance.now();function animate(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!$('overlay').style.display.includes('flex') && $('helpPanel').hidden)for(let c of chicks){if(c.stage==='egg'){c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';continue}if(c.wait>0){c.wait-=dt;c.el.classList.remove('walk')}else{let dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);if(d<5){c.wait=.5+Math.random()*2.5;moveTarget(c)}else{c.x+=dx/d*c.speed*dt;c.y+=dy/d*c.speed*dt;c.el.classList.add('walk');c.el.classList.toggle('flip',dx<0)}}c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';c.el.style.zIndex=5+Math.floor(c.y/10)}requestAnimationFrame(animate)}requestAnimationFrame(animate);
let demoSequence=0;
function showMathHelp(){
 const sequence=++demoSequence;
 const panel=$('helpPanel'),title=$('helpTitle'),visual=$('helpVisual');
 panel.hidden=false;
 document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
 title.textContent='🐥 Watch the chicks!';
 visual.innerHTML='<div class="chicken-demo"><div id="demoLabel">Look at the chicks!</div><div class="demo-birds">'+Array.from({length:currentA},()=>'<span class="demo-bird">🐥</span>').join('')+'</div><div id="demoNumber" class="demo-number"></div><div id="demoQuestion" class="demo-equation"></div></div>';
 const birds=[...visual.querySelectorAll('.demo-bird')];
 const label=visual.querySelector('#demoLabel'),number=visual.querySelector('#demoNumber'),question=visual.querySelector('#demoQuestion');
 const later=(delay,fn)=>setTimeout(()=>{if(sequence===demoSequence&&!panel.hidden)fn()},delay);
 $('retry').disabled=true;$('retry').textContent='Watch the chicks first';
 later(1100,()=>{number.textContent=String(currentA);label.textContent=currentA+' chicks';});
 later(2400,()=>{
   number.textContent='';
   label.textContent=currentB+' chick'+(currentB===1?'':'s')+' walk away...';
   birds.slice(currentA-currentB).forEach((bird,i)=>later(i*650,()=>bird.classList.add('leaving')));
 });
 later(3700+currentB*650,()=>{
   number.textContent='';
   question.textContent=currentA+' − '+currentB+' = ?';
   label.textContent='How many chicks are left?';
 });
 later(4700+currentB*650,()=>{
   $('retry').disabled=false;$('retry').textContent='Choose Again ↻';
 });
 $('msg').textContent='Watch the subtraction, then choose an answer!';
}
$('retry').onclick=()=>{ $('helpPanel').hidden=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=false);if(mistakes>=3){needsCorrectClick=true;$('msg').textContent='Please choose the correct answer: '+answer+' ✓'}else $('msg').textContent='Try again! 🐣'};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function wolfHowl(){playAnimal('coyote')}
async function wolfAttack(){
 const available=chicks.filter(c=>c.el.isConnected),taken=Math.min(available.length,1+Math.floor(Math.random()*3));
 const wolf=document.createElement('div');wolf.className='wolf-visitor';wolf.innerHTML=`<svg class='coyote-art' viewBox='0 0 220 130' xmlns='http://www.w3.org/2000/svg' aria-label='Full body coyote'><path d='M54 63 Q23 38 6 42 Q21 59 45 78Z' fill='#997353' stroke='#604c3d' stroke-width='3'/><path d='M48 60 Q80 41 141 56 L170 73 139 91 66 90Z' fill='#b58a60' stroke='#604c3d' stroke-width='3'/><path d='M67 85 L63 119 76 119 84 87 M121 85 L125 119 139 119 140 82' fill='#8b674c' stroke='#604c3d' stroke-width='3'/><path d='M142 63 L151 26 170 44 185 24 195 61 210 76 187 86 167 79 153 92Z' fill='#b58a60' stroke='#604c3d' stroke-width='3'/><path d='M151 27 L158 50 169 43 M186 26 L185 51 194 57' fill='#d9a98b'/><path d='M183 73 L208 76 193 85 178 83Z' fill='#e8d8c1'/><circle cx='182' cy='63' r='3.5' fill='#27241f'/><circle cx='207' cy='76' r='3.2' fill='#27241f'/><path d='M70 65 Q108 54 145 71' fill='none' stroke='#e4c8a1' stroke-width='7'/></svg>`;farm.appendChild(wolf);
 document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
 $('msg').textContent='A coyote is coming!';wolfHowl();
 await sleep(650);wolf.classList.add('wolf-in');await sleep(850);
 // No graphic violence: selected chickens run away and leave the farm.
 const victims=available.sort(()=>Math.random()-.5).slice(0,taken);
 victims.forEach(c=>{c.el.classList.add('wolf-escape');});
 await sleep(700);victims.forEach(c=>{c.el.remove();let i=chicks.indexOf(c);if(i>=0)chicks.splice(i,1)});
 count=Math.max(0,count-victims.length);update();
 $('msg').textContent=taken?`The coyote took ${taken} chicken${taken===1?'':'s'}! Try again.`:'The coyote found no chickens! Try again.';
 wolf.classList.remove('wolf-in');wolf.classList.add('wolf-out');await sleep(550);wolf.remove();
}
async function submit(selected){if(busy || !$('helpPanel').hidden)return;if(selected!==answer){busy=true;mistakes++;await wolfAttack();showMathHelp();busy=false;return}busy=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('msg').textContent=`Great job! +${answer} eggs 🥚`;sound(740,.14);await sleep(250);$('coop').classList.add('open');await sleep(320);for(let i=0;i<answer;i++){makeChick();count++;update();await sleep(180)}if(answer===0){$('msg').textContent='Great job! Zero eggs this time! 🐣';chirp();await sleep(600)}$('coop').classList.remove('open');await sleep(450);if(count>=levels[level][1])victory();else{newQuestion();busy=false}}
function mapMarkup(){
 let nodes=levels.map((l,i)=>{
   const done=i<=level || i<collected;
   const status=done?'done':i===level+1?'current':'locked';
   // Alternate direction on each row, like a winding board-game trail.
   const row=Math.floor(i/5), col=i%5;
   const order=row*5+(row%2===0?col:4-col);
   const color=l[2];
   return `<div class="map-node ${status}" data-stop="${i}" style="grid-row:${row+1};grid-column:${(row%2===0?col:4-col)+1};--chicken-color:${color}"><span class="map-icon">${done?'🐔':i===level+1?'🐾':'🌱'}</span><span>${i+1}</span><span class="farm-name">${l[0]}</span></div>`;
 }).join('');
 return `<div class="map-heading">🗺️ 20-Farm Adventure</div><div class="map-road"><svg class="map-path" id="mapPath" aria-hidden="true"></svg>${nodes}<div class="map-traveler" id="mapTraveler">🐔</div></div><div class="map-end">🏆 FINISH LINE · LEVEL 20</div>`;
}
function drawMapPath(road){
 const svg=road.querySelector('#mapPath');if(!svg)return;
 const nodes=[...road.querySelectorAll('[data-stop]')].sort((a,b)=>Number(a.dataset.stop)-Number(b.dataset.stop));
 const bounds=road.getBoundingClientRect();
 const points=nodes.map(n=>{const r=n.querySelector('.map-icon').getBoundingClientRect();return {x:r.left+r.width/2-bounds.left,y:r.top+r.height/2-bounds.top}});
 const d=points.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
 svg.setAttribute('viewBox',`0 0 ${road.clientWidth} ${road.clientHeight}`);
 svg.innerHTML=`<path d="${d}"/><path class="route-line" d="${d}"/>`;
 return points;
}

function victory(){
 collected=Math.max(collected,level+1);
 localStorage.setItem('chickenCompletedLevels',collected);
 localStorage.setItem('chickenLevel',Math.min(level+1,19));
 update();
 for(let i=0;i<5;i++)setTimeout(()=>sound(520+i*125,.2,'sine',.07),i*130);
 $('modal').innerHTML=`<h1>🎉 Level Complete!</h1><h2>🐔 Your farm is growing!</h2><p>🐔 ${count} chickens raised · Goal ${levels[level][1]}</p>${mapMarkup()}<button id="next" disabled>${level===19?'🏆 Adventure Complete! Play Again':'🐔 Travel to Next Farm ➜'}</button>`;
 $('overlay').style.display='flex';
 const traveler=$('mapTraveler'),road=$('modal').querySelector('.map-road');
 function moveTo(i){
  const node=road.querySelector('[data-stop="'+i+'"]');if(!node)return;
  const icon=node.querySelector('.map-icon').getBoundingClientRect(),bounds=road.getBoundingClientRect();
  traveler.style.left=(icon.left+icon.width/2-bounds.left)+'px';
  traveler.style.top=(icon.top+icon.height/2-bounds.top)+'px';
 }
 requestAnimationFrame(()=>{
  drawMapPath(road);
  // Start on the farm just completed, then travel to the NEXT numbered farm.
  traveler.style.transition='none';moveTo(level);
  requestAnimationFrame(()=>setTimeout(()=>{
   traveler.style.transition='left 1.15s ease-in-out,top 1.15s ease-in-out';
   moveTo(Math.min(level+1,19));
   setTimeout(()=>{$('next').disabled=false},1250);
  },280));
 });
 $('next').onclick=()=>{level=level===19?0:level+1;start()};
}
function start(){nextFarmCall=performance.now()+2500;count=0;busy=false;for(let c of chicks)c.el.remove();chicks=[];$('overlay').style.display='none';$('app').className='theme'+(level+1);$('levelTitle').textContent=`Level ${level+1} · ${levels[level][0]}`;$('roof').style.background=levels[level][3];$('house').style.background=level===15?'#dcecf2':level===7?'#eda36c':level===19?'#d9b6e5':'#e9b579';farm.querySelectorAll('.deco').forEach((e,i)=>e.textContent=levels[level][5+i%2]);update();newQuestion()}
start();

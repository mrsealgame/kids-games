const whites=['C4','D4','E4','F4','G4','A4','B4','C5'];const blacks=[['C#4',0],['D#4',1],['F#4',3],['G#4',4],['A#4',5]];const midi={'C3':48,'C#3':49,'D3':50,'D#3':51,'E3':52,'F3':53,'F#3':54,'G3':55,'G#3':56,'A3':57,'A#3':58,'B3':59,'C4':60,'C#4':61,'D4':62,'D#4':63,'E4':64,'F4':65,'F#4':66,'G4':67,'G#4':68,'A4':69,'A#4':70,'B4':71,'C5':72};let audio=null,showLabels=true,playing=false,paused=false,demo=false,startAt=0,pauseAt=0,notes=[],score=0,combo=0,maxCombo=0,perfect=0,good=0,miss=0,wrong=0,lastTick=-1,lastAccomp=-1,held={},raf=0,finishTimer=null,particles=[],shots=[],playedNote="",playedAt=-10,shibaMood="happy",shibaAt=0,starFlights=[];const board=$('keyboard');whites.forEach((n,i)=>{const b=document.createElement('div');b.className='white';b.dataset.note=n;b.innerHTML=`<span>${n.replace(/[345]/g,'')}</span>`;board.appendChild(b)});blacks.forEach(([n,i])=>{let b=document.createElement('div');b.className='black';b.dataset.note=n;b.style.left=`calc(${(i+1)/8*100}% - 3.7%)`;b.innerHTML=`<span style="position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#fff;font-size:11px">${n.replace(/[345]/g,'')}</span>`;board.appendChild(b)});function updateLabels(){board.querySelectorAll('.white').forEach(b=>b.querySelector('span').textContent=showLabels?b.dataset.note.replace(/[345]/g,''):(b.dataset.note.startsWith('C')?'C':''))}board.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-note]');if(!b)return;e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch{}press(b.dataset.note,b);b.addEventListener('pointerup',()=>{release(b.dataset.note);b.classList.remove('pressed')},{once:true});b.addEventListener('pointercancel',()=>{release(b.dataset.note);b.classList.remove('pressed')},{once:true})});const keymap={a:'C4',s:'D4',d:'E4',f:'F4',g:'G4',h:'A4',j:'B4',k:'C5'};document.addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='SELECT')return;const n=keymap[e.key.toLowerCase()]?.replace('4',activeClef==='bass'?'3':'4').replace('5',activeClef==='bass'?'4':'5');if(n){e.preventDefault();press(n,board.querySelector(`[data-note="${n}"]`))}});document.addEventListener('keyup',e=>{const n=keymap[e.key.toLowerCase()]?.replace('4',activeClef==='bass'?'3':'4').replace('5',activeClef==='bass'?'4':'5');if(n){release(n);board.querySelector(`[data-note="${n}"]`)?.classList.remove('pressed')}});function release(n){board.querySelector(`[data-note="${n}"]`)?.classList.remove('pressed');if(!held[n])return;const entry=held[n];delete held[n];const t=((paused?pauseAt:performance.now())-startAt)/1000,beat=60/Number($('speed').value);if(entry.target){let target=entry.target;const actual=Math.max(0,t-entry.started);const required=target.dur*beat*HOLD_PLAY_RATIO;const fraction=Math.min(1,actual/required);target.progress=fraction;target.frozenProgress=fraction;target.holding=false;target.state=fraction>=.90?'perfect':fraction>=.60?'good':fraction>=.35?'ok':'miss';target.hitAt=t;if(target.state!=='miss')impact(target,target.state,t);else{target.rating='MISS';target.ratingColor='#9a9da8';}if(target.state==='perfect'){perfect++;score+=100*target.dur;combo++;shibaMood='cheer'}else if(target.state==='good'||target.state==='ok'){good++;score+=(target.state==='ok'?35:60)*target.dur;combo++;shibaMood='cheer'}else{miss++;combo=0;shibaMood='surprised'}maxCombo=Math.max(combo,maxCombo);shibaAt=t;setFeedback(target.state==='perfect'?'PERFECT':target.state==='good'?'GOOD':target.state==='ok'?'OK':'MISS');stats()}}function press(n,b){if(held[n])return;if(b)b.classList.add('pressed');tone(n);if(!playing||paused||demo){setTimeout(()=>b&&b.classList.remove('pressed'),180);return}const t=(performance.now()-startAt)/1000;shots.push({n,t,life:0,hit:false});playedNote=n.replace(/[345]/g,'');playedAt=t;let candidates=notes.filter(x=>!x.state&&!x.holding&&Math.abs(t-x.time)<.32);let right=candidates.filter(x=>x.note===n).sort((a,b)=>Math.abs(t-a.time)-Math.abs(b.time-t))[0];if(right){shots[shots.length-1].hit=true;if(right.dur>1){right.holdi function impact(note,kind,t){const L=layout(),x=L.hitX,y=noteY(note.note,L);note.bounceAt=t;note.bounceVy=-135;note.bounceVx=-110;const palette=kind==='perfect'?['#ffd13d','#ff7c32','#fff6ad','#ff3e83']:kind==='good'?['#5cd7ff','#5b8eff','#d5f7ff','#d667ff']:['#79efaa','#baffdf','#fff'];for(let i=0;i<90;i++){const a=Math.PI*2*i/90+Math.random()*.2,s=90+Math.random()*230;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,born:t,life:.65+Math.random()*.55,color:palette[i%3],r:2.5+Math.random()*5})}note.rating=kind==='perfect'?'PERFECT':kind==='good'?'GOOD':'OK';note.ratingColor=kind==='perfect'?'#ffc528':kind==='good'?'#27c5ff':'#65df7e';if(!demo)flyToStar(note,t);}
function ensureAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(n,volume=.35){try{const ac=ensureAudio(),f=440*Math.pow(2,(midi[n]-69)/12),t=ac.currentTime;const master=ac.createGain();master.gain.setValueAtTime(.0001,t);master.gain.exponentialRampToValueAtTime(volume,t+.009);master.gain.exponentialRampToValueAtTime(.0001,t+1.55);master.connect(ac.destination);[[1,.72],[2,.17],[3,.08],[4,.03]].forEach(([harm,amp])=>{let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f*harm,t);g.gain.value=amp;o.connect(g).connect(master);o.start(t);o.stop(t+1.6)});const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f*2;g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.09)}catch(e){console.warn(e)}}function accompaniment(beatIndex){const chords=[['C3','E3','G3'],['F3','A3','C4'],['G3','B3','D4'],['C3','E3','G3']];const chord=chords[Math.floor(beatIndex/4)%4];if(beatIndex%4===0){chord.forEach((n,i)=>setTimeout(()=>tone(n,.045),i*28))}else if(beatIndex%2===0){tone(chord[0],.035)}}function tick(){try{const ac=ensureAudio(),t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.07)}catch{}}

if($('scoreLabel').textContent!==String(score)){const old=Number($('scoreLabel').textContent)||0; $('scoreLabel').textContent=score;bounce('scoreLabel');if(score>old){const gain=$('scoreGain');gain.textContent='+'+(score-old);gain.classList.remove('gainPop');void gain.offsetWidth;gain.classList.add('gainPop')}}

function flyToStar(n,t){const r=canvas.getBoundingClientRect(),L=layout();const sr=$('scoreStar').getBoundingClientRect();const el=document.createElement('span');el.className='flyNote';const icon=document.createElement('canvas');icon.width=42;icon.height=65;const c=icon.getContext('2d');c.fillStyle='#ffc72e';c.strokeStyle='#fff3a5';c.lineWidth=2;c.save();c.translate(15,49);c.rotate(-.4);c.beginPath();c.ellipse(0,0,13,9,0,0,Math.PI*2);c.fill();c.stroke();c.restore();c.strokeStyle='#ffc72e';c.lineWidth=5;c.beginPath();c.moveTo(27,48);c.lineTo(27,5);c.stroke();el.appendChild(icon);document.body.appendChild(el);

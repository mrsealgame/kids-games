<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鱼游走了 · 10以内减法</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC',sans-serif;background:linear-gradient(#bcefff,#52b9dc 55%,#137aa8);min-height:100vh;color:#124663;text-align:center}.wrap{max-width:860px;margin:auto;padding:20px}h1{font-size:clamp(27px,5vw,42px);margin:12px 0}.top{display:flex;justify-content:space-between;font-weight:700;background:#ffffffa8;border-radius:18px;padding:12px 18px}.sea{position:relative;margin:18px 0;background:linear-gradient(#72d4ec,#168cb8);height:330px;border:5px solid #ffffff8a;border-radius:28px;overflow:hidden;box-shadow:0 12px 30px #00597855}.sea:after{content:'🌿　🪸　🐚　🌱　🪸';position:absolute;bottom:5px;left:0;width:100%;font-size:30px;pointer-events:none}.fish{position:absolute;font-size:46px;transition:transform 1s ease,opacity 1s ease;filter:drop-shadow(1px 4px 2px #166c8b66)}.fish.leave{transform:translateX(850px) rotate(15deg)!important;opacity:0}.bubble{position:absolute;border:2px solid #e8ffffaa;border-radius:50%;background:#ffffff22;animation:rise 7s linear infinite}@keyframes rise{from{transform:translateY(340px)}to{transform:translateY(-100px)}}.question{font-size:clamp(25px,5vw,36px);font-weight:800;background:#ffffffdb;border-radius:20px;padding:14px;margin:10px 0}.hint{font-size:19px;min-height:30px;font-weight:700}.answers{display:flex;gap:15px;justify-content:center;margin:18px 0}.answers button{width:90px;height:90px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 30% 25%,#fff,#b8f1ff 45%,#60c6ec);font-size:36px;font-weight:900;color:#125b80;cursor:pointer;box-shadow:0 7px 0 #2181a8;touch-action:manipulation}.answers button:active{transform:translateY(5px);box-shadow:0 2px 0 #2181a8}.action{border:0;border-radius:15px;background:#ffdb72;color:#6d4c0b;padding:14px 24px;font-size:20px;font-weight:800;cursor:pointer}.action:disabled{opacity:.5}.message{min-height:40px;font-size:24px;font-weight:800;color:white;text-shadow:0 2px 3px #075a7b}.footer{font-size:14px;color:#eaffff} @media(max-width:480px){.sea{height:280px}.fish{font-size:36px}.answers button{width:76px;height:76px}}</style></head><body><main class="wrap"><h1>🐟 小鱼游走了 🫧</h1><div class="top"><span id="progress">第 1 / 10 题</span><span id="stars">⭐ 0</span></div><div class="sea" id="sea" aria-label="海底小鱼游戏区域"></div><div class="question" id="question">准备好了吗？</div><div class="hint" id="hint">观察小鱼，看看游走了几条！</div><div class="answers" id="answers"></div><div class="message" id="message" aria-live="polite"></div><button class="action" id="next">开始游戏 ▶</button><p class="footer">没有计时器，慢慢想就好 💙</p></main><script>const sea=document.getElementById('sea'),q=document.getElementById('question'),hint=document.getElementById('hint'),answers=document.getElementById('answers'),msg=document.getElementById('message'),next=document.getElementById('next'),progress=document.getElementById('progress'),stars=document.getElementById('stars');let round=0,score=0,total=0,gone=0,correct=0,ready=false,started=false,fish=[];function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function makeSea(){sea.innerHTML='';for(let i=0;i<12;i++){let b=document.createElement('div');b.className='bubble';let size=rand(8,30);Object.assign(b.style,{width:size+'px',height:size+'px',left:rand(0,95)+'%',top:rand(-80,250)+'px',animationDelay:-rand(0,7)+'s'});sea.append(b)}}function startRound(){started=true;ready=false;next.style.display='none';answers.innerHTML='';msg.textContent='';round++;progress.textContent=`第 ${round} / 10 题`;total=rand(4,10);gone=rand(1,total-1);correct=total-gone;makeSea();fish=[];let cols=5;for(let i=0;i<total;i++){let f=document.createElement('div');f.className='fish';f.textContent=['🐟','🐠','🐡'][i%3];let col=i%cols,row=Math.floor(i/cols);f.style.left=(8+col*18)+'%';f.style.top=(35+row*92)+'px';sea.append(f);fish.push(f)}q.textContent=`海里有 ${total} 条小鱼`;hint.textContent='仔细看看，准备数数！';setTimeout(()=>{if(!started)return;q.textContent=`有 ${gone} 条小鱼游走啦！`;hint.textContent='还剩下几条小鱼？';let idx=[...Array(total).keys()].sort(()=>Math.random()-.5).slice(0,gone);idx.forEach(i=>fish[i].classList.add('leave'));setTimeout(showAnswers,1100)},1600)}function showAnswers(){ready=true;q.textContent=`${total} − ${gone} = ?`;let opts=new Set([correct]);while(opts.size<3)opts.add(rand(0,10));[...opts].sort(()=>Math.random()-.5).forEach(n=>{let b=document.createElement('button');b.textContent=n;b.setAttribute('aria-label',`答案 ${n}`);b.onclick=()=>choose(n);answers.append(b)})}function choose(n){if(!ready)return;if(n===correct){ready=false;score++;stars.textContent=`⭐ ${score}`;msg.textContent=['太棒啦！🌟','答对了！🐬','你是海洋数学家！🪸'][rand(0,2)];hint.textContent=`没错！${total} − ${gone} = ${correct}`;answers.querySelectorAll('button').forEach(b=>b.disabled=true);next.style.display='inline-block';next.textContent=round===10?'打开海底宝箱 🎁':'下一题 ➜'}else{msg.textContent='再试试看 💙 数一数留下的小鱼！'}}function handleNext(){if(round===10){started=false;makeSea();q.textContent='🎁 宝箱打开啦！';hint.textContent=`完成10题，获得 ${score} 颗海星！`;msg.textContent='🐬 🐚 🪸 你真棒！';answers.innerHTML='';next.textContent='再玩一次 ↻';next.style.display='inline-block';round=0;score=0;stars.textContent='⭐ 0';return}if(!started&&round===0){stars.textContent='⭐ 0'}startRound()}next.addEventListener('click',handleNext);makeSea();</script></body></html>

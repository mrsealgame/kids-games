<header><h1>🌾 Caterpillar Farming Adventure</h1></header>

function render(){drawCreature();let done=s.level>=20;$('level').textContent=done?'🦋 Level 20':`🌟 Level ${s.level+1}`;let plot=$('plot');plot.className='obj plot';if(s.step===2||(s.step===3&&window.pouringNow))plot.classList.add('planted');if(s.step>=3&&!(s.step===3&&window.pouringNow))plot.classList.add('wet');if(s.step===4)plot.classList.add('ready');$('seedsOnSoil').classList.toggle('visible',!done&&(s.step===2||s.step===3));$('crop').textContent=done?'🌸':s.step===0?'':s.step===1||s.step===2?'':s.step===3?'':s.step===4?'🌱':s.step===7?'🌿':s.step>=5?'': '';$('bagIcon').textContent=done?'🌱':emojis[chosen()];$('bag').classList.toggle('show',!done&&s.step===1);$('bucket').classList.toggle('show',!done&&s.water>0&&s.step===2);$('fruit').classList.toggle('show',!done&&s.step===5);$('fruit').textContent=done?'':emojis[chosen()];$('cat').querySelector('svg').style.display=done?'none':'block';save();focusNext()}function clickCat(){if(s.level>=20){speak('A beautiful butterfly flies over the flowers.',true);return}if(s.step===6)return;if(s.step===0&&!s.listened){waitingForSpeech=true;focusNext()}speak(cur()[2],true)}function openCrate(){if(s.level>=20||s.step!==0||!s.listened||waitingForSpeech)return;const choices=items.slice(0,s.level+1).map((item,i)=>({name:item[0],index:i}));for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}openModal('📦 Choose a Seed',`<div class="choices">${choices.map(x=>`<button onclick="chooseSeed(${x.index})">${x.name}</button>`).join('')}</div>`,'seed')}

function openReading(){if(s.level>=20||s.step!==2)return;const d=cur();openModal('📖 Reading',`<p style="font-size:23px">${d[2]}</p><h3>${d[3]}</h3><div class="choices">${d[4].map((x,i)=>`<button onclick="checkReading(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div>`,'reading')}function checkReading(n){if(n!==cur()[5]){fb('🌷 Listen and try again!');speak(cur()[2]);return}s.water=1;closeModal();render();animateBucket();sound('water')}function animateBucket(){const b=$('bucket');b.animate([{transform:'translateY(55px)',opacity:.2},{transform:'translateY(-12px)',opacity:1},{transform:'translateY(0)',opacity:1}],{duration:1200,easing:'ease-out'})}function clickPlot(){if(s.step===4)openWriting()}function startGrow(next){$('growbar').classList.add('show');$('growfill').style.transition='none';$('growfill').style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{$('growfill').style.transition='width 500ms linear';$('growfill').style.width='100%'}));clearTimeout(timer);timer=setTimeout(()=>{$('growbar').classList.remove('show');$('growfill').style.width='0';s.step=next;render();sound(next===4?'sprout':'ripe');$('crop').classList.add('sprout');setTimeout(()=>$('crop').classList.remove('sprout'),500)},500)}function planted(){s.step=2;render();sound('sow')}function watered(){s.water=0;window.pouringNow=true;s.step=3;render();const plot=$('plot');const pouring=document.createElement('div');pouring.className='pour-bucket';pouring.textContent='🪣';plot.appendChild(pouring);$('waterfall').classList.add('show');setTimeout(()=>{pouring.remove();$('waterfall').classList.remove('show');window.pouringNow=false;render();startGrow(4)},1100)}function openWriting(){if(s.step!==4)return;const d=items[chosen()];openModal('✏️ Writing',`<h3>${d[6]}</h3><input id="writingAnswer" autocomplete="off" spellcheck="false" placeholder="Missing word"><p><button onclick="checkWriting()">Check Answer</button></p>`,'writing');$('writingAnswer').focus()}function checkWriting(){const d=items[chosen()],word=d[7],answer=$('writingAnswer').value.trim().toLowerCase().replace(/[.!?]/g,'');if(answer!==word){writingMistakes++;let audio,msg;if(writingMistakes===1){audio=d[2];msg='🌼 Listen to the story.'}else if(writingMistakes===2){audio=d[6].replace('___','blank');msg='🌷 Listen to the sentence.'}else if(writingMistakes===3){audio='The answer is '+word+'.';msg='💛 You can do it!'}else{audio=word.toUpperCase().split('').join(', ')+'. '+word+'.';msg='⭐ '+word.toUpperCase().split('').join(' · ')}fb(msg);speak(audio);return}s.pendingSentence=d[6].replace('___',answer);s.step=7;closeModal();render();startGrow(5)}function chomp(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<3;i++){const t=ctx.currentTime+i*.17;const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(310-i*45,t);o.frequency.exponentialRampToValueAtTime(95,t+.13);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.16)}setTimeout(()=>ctx.close(),1300)}catch{}}function alignMapPaths(){

let page=0;function openBook(){page=Math.max(0,s.book.length-1);drawBook()}function drawBook(){const total=s.book.length,b=s.book[page];openModal('📖 My Storybook',`<p>${total} / 20 pages unlocked</p>${b?`<div class="bookpage"><div style="font-size:65px">${emojis[b.level]}</div><b>Page ${page+1}</b><p>${b.sentence}</p><p>✏️ ${b.writing}</p><button onclick="listenStoryPage()">🔊 Listen</button></div>`:'<div class="bookpage">📖</div>'}<button ${page===0?'disabled':''} onclick="page--;drawBook()">◀</button><button ${page>=total-1?'disabled':''} onclick="page++;drawBook()">▶</button>`,'book')}function listenStoryPage(){const entry=s.book[page];if(entry&&entry.sentence)speak(entry.sentence)}function resetGame(){if(confirm('Erase progress and storybook?')){localStorage.removeItem(KEY);location.reload()}}
function inRect(x,y,el){const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}function dragStart(e){const el=e.target.closest('[data-kind]');if(!el)return;const kind=el.dataset.kind;if((kind==='seed'&&s.step!==1)||(kind==='water'&&(s.step!==2||s.water<1))||(kind==='fruit'&&s.step!==5))return;e.preventDefault();e.stopPropagation();const ghost=document.createElement('div');ghost.className='dragghost';if(kind==='seed'){ghost.classList.add('seedbag-ghost');ghost.innerHTML=el.innerHTML;}else{ghost.textContent=kind==='water'?'🪣':emojis[chosen()];}document.body.appendChild(ghost);drag={id:e.pointerId,kind,ghost,el};el.classList.add('drag-origin-hidden');for(const id of ['crate','bag','well','bucket','plot','fruit','cat'])$(id).classList.remove('next-focus');if(kind!=='fruit')$('plot').classList.add('next-focus');else $('cat').classList.add('next-focus');move(e);el.setPointerCapture(e.pointerId)}function move(e){if(!drag)return;drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';$('plot').classList.toggle('dropready',drag.kind!=='fruit'&&inRect(e.clientX,e.clientY,$('plot')))}function dragEnd(e){if(!drag||drag.id!==e.pointerId)return;const kind=drag.kind;drag.el.classList.remove('drag-origin-hidden');drag.ghost.remove();drag=null;$('plot').classList.remove('dropready');if(kind==='seed'&&inRect(e.clientX,e.clientY,$('plot')))planted();else if(kind==='water'&&inRect(e.clientX,e.clientY,$('plot')))watered();else if(kind==='fruit'&&inRect(e.clientX,e.clientY,$('cat')))feed();focusNext()}document.addEventListener('pointerdown',dragStart);document.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId)move(e)});document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',()=>{if(drag){drag.el.classList.remove('drag-origin-hidden');drag.ghost.remove();drag=null;$('plot').classList.remove('dropready');focusNext()}});

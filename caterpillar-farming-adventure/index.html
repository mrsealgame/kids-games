const KEY='caterpillarFarmingV18';const $=id=>document.getElementById(id);let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s||!Number.isInteger(s.level)||s.level<0||s.level>20)s={level:0,step:0,book:[],water:0};if(!Array.isArray(s.book))s.book=[];

 const it=items[nursery.want];
 if(which==='listen'){
  openModal('🎧 Listening Review',`<p style="font-size:20px">Listen to the story, then choose the correct word.</p><button onclick="nurserySpeak(items[nursery.want][2])">🔊 Listen again</button><div class="choices">${Array.from({length:Math.max(nurseryPool(),nursery.want+1)},(_,i)=>i).filter(i=>i<10||i===nursery.want).sort(()=>Math.random()-.5).map(i=>`<button onclick="nurseryAnswer('listen',${i})">${items[i][0]}</button>`).join('')}</div>`,'nursery');
  nurserySpeak(it[2]);
 }else if(which==='read'){
  openModal('📖 Reading Review',`<p>${it[2]}</p><p><strong>${it[3]}</strong></p><div class="choices">${it[4].map((v,i)=>`<button onclick="nurseryAnswer('read',${i})">${v}</button>`).join('')}</div>`,'nursery');
 }else{
  openModal('✏️ Writing Review',`<p><strong>${it[6]}</strong></p><button type="button" onclick="nurserySpeak(items[nursery.want][2])">🔊 Listen</button><br><input id="nurseryWriting" autocomplete="off" placeholder="Type the missing word" style="font-size:22px;max-width:95%;padding:10px"><button onclick="nurseryAnswer('write')">Check ✓</button>`,'nursery');
 }
}
function nurseryAnswer(which,value){const it=items[nursery.want];const correct=which==='listen'?value===nursery.want:which==='read'?value===it[5]:($('nurseryWriting')?.value||'').trim().toLowerCase()===it[7].toLowerCase();
 if(!correct){fb('Try again! 💛');sound('package');if(which==='listen')nurserySpeak(it[2]);return}
 closeModal();sound('ripe');nursery.phase=which==='listen'?'seed':which==='read'?'sprout':'fruit';nurseryRefresh();
}
function nurseryPlant(){if(nursery.phase!=='seed')return;nursery.phase='water';sound('sow');nurseryRefresh()}
function nurseryFeed(){if(nursery.phase!=='fruit')return;const pet=nurseryPet();pet.meals++;nursery.meals++;nursery.phase='rest';nursery.nextHungry=Date.now()+3000;nurseryHeartUntil=Date.now()+1500;ranchSave();nurseryStore();sound('ripe');nurseryRefresh();if(pet.meals===12)gateCheck();if(pet.meals>=15)nurseryBirth();else setTimeout(nurseryRefresh,1600)}
let nurseryDrag=null;
document.addEventListener('pointerdown',e=>{let packet=e.target.closest('#nurseryPacket'),fruit=e.target.closest('#nurseryFruit');if(!packet&&!fruit)return;e.preventDefault();e.stopPropagation();const kind=packet?'seed':'fruit';const ghost=document.createElement('div');ghost.className='nursery-drag-ghost';if(kind==='seed'){ghost.classList.add('packet-ghost');ghost.innerHTML=emojis[nursery.want]+'<br><small>'+items[nursery.want][0]+'</small>'}else ghost.textContent=emojis[nursery.want];document.body.appendChild(ghost);nurseryDrag={kind,ghost,id:e.pointerId};try{e.target.setPointerCapture(e.pointerId)}catch(err){}if(packet)packet.style.opacity='.35';ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';});
document.addEventListener('pointermove',e=>{if(nurseryDrag&&e.pointerId===nurseryDrag.id){nurseryDrag.ghost.style.left=e.clientX+'px';nurseryDrag.ghost.style.top=e.clientY+'px';const soil=$('nurserySoil');if(soil)soil.classList.toggle('nursery-dropready',nurseryDrag.kind==='seed'&&inRect(e.clientX,e.clientY,soil))}});
document.addEventListener('pointerup',e=>{if(!nurseryDrag||e.pointerId!==nurseryDrag.id)return;e.preventDefault();let kind=nurseryDrag.kind;nurseryDrag.ghost.remove();nurseryDrag=null;const soil=$('nurserySoil');if(soil)soil.classList.remove('nursery-dropready');const packet=$('nurseryPacket');if(packet)packet.style.opacity='1';if(kind==='seed'&&$('nurserySoil')&&inRect(e.clientX,e.clientY,$('nurserySoil')))nurseryPlant();if(kind==='fruit'&&$('ranchResidents')&&inRect(e.clientX,e.clientY,$('ranchResidents')))nurseryFeed()});
document.addEventListener('pointercancel',()=>{if(nurseryDrag){nurseryDrag.ghost.remove();nurseryDrag=null;nurseryRefresh()}});
const nurseryBaseRender=render;render=function(){nurseryBaseRender();nurseryRefresh()};
nurseryRefresh();setInterval(nurseryRefresh,500);
</script></body></html>

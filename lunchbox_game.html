<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>柴犬的午餐饭盒</title><style>
:root{--bg:#f8f0df;--ink:#665344;--green:#819b75;--pink:#dba99a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff7e9,#f0e3cc);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);min-height:100dvh}.app{max-width:760px;margin:auto;padding:18px 16px 32px}h1{text-align:center;font-size:clamp(25px,6vw,37px);margin:8px 0 3px}.sub{text-align:center;margin:0 0 14px;color:#9a806b}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.badge{background:#fffaf1;border:2px solid #e9d9c1;border-radius:30px;padding:9px 13px;font-weight:700}.scene{background:#fffaf0;border:3px solid #e9d7bb;border-radius:28px;padding:15px;box-shadow:0 8px 0 #e6d6bf}.dog{text-align:center;font-size:58px;line-height:1}.speech{text-align:center;font-size:17px;font-weight:750;margin:7px 0 15px;min-height:28px}.box{background:#c8a47c;border:8px solid #b58b65;border-radius:30px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;box-shadow:inset 0 4px 8px #9c775a55}.slot{background:#f3e5cc;border:3px dashed #dfc9a9;border-radius:20px;min-height:106px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;cursor:pointer}.slot.filled{border-style:solid;background:#fff3dd}.slot .emoji{font-size:42px}.slot .hint{font-size:12px;color:#aa927b}.slot .remove{position:absolute;right:5px;top:4px;border:0;background:#e9c9b7;border-radius:50%;width:25px;height:25px;color:#77594a;font-size:17px}.nutrition{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:15px 0}.nut{background:#eae5d9;color:#a9a196;padding:8px 10px;border-radius:18px;font-size:12px;font-weight:700;border:2px solid #e3d9c9}.nut.on{background:#e0ebd7;border-color:#a6c197;color:#526d4e}.section{font-size:20px;margin:22px 0 10px}.foods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.food{border:2px solid #e5d6bf;background:#fffaf1;border-radius:19px;padding:13px 4px 10px;min-height:106px;color:var(--ink);font:inherit;font-weight:750;cursor:pointer;box-shadow:0 4px 0 #e6d7c2;touch-action:manipulation}.food:active{transform:translateY(3px);box-shadow:none}.food .icon{display:block;font-size:36px;margin-bottom:6px}.food small{display:block;font-size:11px;color:#a18d76;margin-top:3px}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;border:0;border-radius:20px;padding:15px 8px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;touch-action:manipulation}.reset{background:#ead9c6;color:#755c48}.finish{background:#86a17b;color:white}.result{display:none;position:fixed;inset:0;background:#4e423b99;align-items:center;justify-content:center;padding:18px;z-index:5}.card{background:#fff8eb;border:4px solid #e9d3b6;border-radius:28px;max-width:370px;width:100%;text-align:center;padding:26px 18px}.card h2{font-size:27px}.card p{line-height:1.6}.card button{border:0;border-radius:20px;padding:14px 30px;background:#86a17b;color:white;font-size:18px;font-weight:800}.stars{font-size:42px}@media(max-width:360px){.foods{gap:6px}.food{font-size:13px}}
</style></head><body><main class="app"><h1>🍱 柴犬的午餐饭盒</h1><p class="sub">为小朋友做一份暖暖的午餐吧！</p><div class="top"><span class="badge">🌞 第 <span id="day">1</span> 天</span><span class="badge">⭐ <span id="score">0</span> 分</span></div><div class="scene"><div class="dog">🐕</div><div class="speech" id="speech">汪！选 4 样食物装进饭盒吧～</div><div class="box" id="box"></div><div class="nutrition" id="nutrition"></div></div><h2 class="section">🥕 食物小厨房 · 点击添加</h2><div class="foods" id="foods"></div><div class="actions"><button class="reset" id="reset">🔄 清空饭盒</button><button class="finish" id="finish">✨ 完成午餐</button></div></main><div class="result" id="modal"><div class="card"><div class="stars" id="stars"></div><h2 id="title"></h2><p id="detail"></p><button id="next">制作下一份 🍱</button></div></div><script>
(()=>{'use strict';const items=[['🍚','米饭','谷物'],['🍞','面包','谷物'],['🍙','饭团','谷物'],['🥦','西兰花','蔬菜'],['🥕','胡萝卜','蔬菜'],['🥒','黄瓜','蔬菜'],['🍗','鸡腿','蛋白质'],['🥚','鸡蛋','蛋白质'],['🍤','虾仁','蛋白质'],['🍎','苹果','水果'],['🍓','草莓','水果'],['🍊','橘子','水果'],['🧀','奶酪','乳制品'],['🥛','牛奶','乳制品'],['🧁','小蛋糕','美味度']];const cats=[['🌾','谷物'],['🥬','蔬菜'],['🍖','蛋白质'],['🍎','水果'],['🥛','乳制品'],['✨','美味度']];let slots=[null,null,null,null],day=1,score=0;const el=id=>document.getElementById(id);const foodRoot=el('foods');items.forEach((f,i)=>{let b=document.createElement('button');b.className='food';b.innerHTML=`<span class="icon">${f[0]}</span>${f[1]}<small>${f[2]}</small>`;b.addEventListener('click',()=>add(i));foodRoot.appendChild(b)});function add(i){let pos=slots.indexOf(null);if(pos<0){el('speech').textContent='饭盒满啦！可以点 × 换一种食物。';return}slots[pos]=i;el('speech').textContent=`${items[i][1]}放进去啦！${slots.filter(x=>x!==null).length}/4`;render()}function render(){el('box').replaceChildren();slots.forEach((v,i)=>{let d=document.createElement('div');d.className='slot'+(v===null?'':' filled');if(v===null){d.innerHTML='<span class="emoji">＋</span><span class="hint">空位置</span>'}else{d.innerHTML=`<span class="emoji">${items[v][0]}</span><span class="hint">${items[v][1]}</span><button class="remove" aria-label="移除${items[v][1]}">×</button>`;d.querySelector('button').addEventListener('click',e=>{e.stopPropagation();slots[i]=null;render();el('speech').textContent='换一道好吃的吧！'})}el('box').appendChild(d)});let present=new Set(slots.filter(v=>v!==null).map(v=>items[v][2]));el('nutrition').innerHTML=cats.map(([icon,c])=>`<span class="nut ${present.has(c)?'on':''}">${icon} ${c}</span>`).join('')}el('reset').addEventListener('click',()=>{slots=[null,null,null,null];el('speech').textContent='重新挑选喜欢的食物吧！';render()});el('finish').addEventListener('click',()=>{let chosen=slots.filter(v=>v!==null);if(!chosen.length){el('speech').textContent='先放一点食物进饭盒吧！';return}let types=new Set(chosen.map(v=>items[v][2]));let core=['谷物','蔬菜','蛋白质'];let balanced=core.every(c=>types.has(c));let points=chosen.length*10+types.size*10+(balanced?30:0);score+=points;el('score').textContent=score;el('stars').textContent=balanced?'⭐⭐⭐':types.size>=3?'⭐⭐':'⭐';el('title').textContent=balanced?'营养小达人！':'好香的午餐！';el('detail').textContent=`这份饭盒有 ${chosen.length} 样食物、${types.size} 种营养类别，获得 ${points} 分！`+(balanced?' 谷物、蔬菜和蛋白质都齐啦！':' 下次试试搭配谷物、蔬菜和蛋白质吧！');el('modal').style.display='flex'});el('next').addEventListener('click',()=>{day++;el('day').textContent=day;slots=[null,null,null,null];el('speech').textContent='汪汪！今天也来做美味饭盒！';el('modal').style.display='none';render()});render()})();
</script></body></html>

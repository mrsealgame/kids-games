<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐕🐛 柴犬和毛毛虫的蛋糕店</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#fff4df;color:#635044}main{max-width:960px;margin:auto;padding:15px}h1,p{text-align:center}h1{color:#a66d52}.stage{background:linear-gradient(#fce6c8 70%,#d9b493 70%);border:5px solid #e4bc92;border-radius:24px;min-height:245px;display:flex;align-items:end;justify-content:space-around;padding:20px;position:relative}.character{font-size:76px;animation:bob 2s infinite alternate}.speech{position:absolute;top:12px;left:10%;right:10%;text-align:center;background:#fffaf0;border-radius:22px;padding:12px;font-weight:700;font-size:19px}.cake{font-size:92px;min-width:130px;text-align:center}.panel{background:#fffdf8;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 3px 12px #ad896333}.progress{display:flex;justify-content:space-between;gap:4px;font-size:13px;flex-wrap:wrap}.step{padding:7px;border-radius:12px;background:#f3e8db}.step.on{background:#a4c8a0;color:#233d2c;font-weight:bold}h2{text-align:center;margin:8px}#options{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin-top:12px}button{border:2px solid #d8b493;border-radius:17px;background:#fff1d8;padding:13px;cursor:pointer;font-size:18px;font-weight:700;color:#664c3c;touch-action:manipulation}button:hover{background:#fce0af}button:disabled{opacity:.5}button.selected{background:#b9d8b1;border-color:#6c9e72}.actions{text-align:center;margin:15px}.primary{background:#b7d8b1}#message{text-align:center;min-height:28px;font-weight:bold;color:#9a674d}.stars{text-align:center;font-size:24px}@keyframes bob{to{transform:translateY(-9px)}}@media(max-width:500px){.character{font-size:52px}.cake{font-size:67px;min-width:80px}.stage{min-height:205px}.speech{font-size:16px}}</style></head><body><main><h1>🐕 柴犬和毛毛虫的蛋糕店 🐛</h1><p>一起准备材料、搅拌、烘烤、装饰美味蛋糕！</p><div class="stage"><div class="speech" id="speech">欢迎来到我们的蛋糕店！</div><div class="character">🐕</div><div class="cake" id="cake">🥣</div><div class="character">🐛</div></div><div class="panel"><div class="progress" id="progress"></div><h2 id="heading"></h2><p id="instruction"></p><div id="options"></div><div class="actions"><button class="primary" id="next" style="display:none">继续 ➜</button></div><div id="message" aria-live="polite"></div></div><div class="stars" id="stars"></div><div class="actions"><button id="reset">🔄 重新开始</button></div></main><script>const steps=['选口味','准备材料','搅拌面糊','放入烤箱','装饰蛋糕','完成'];let step=0,flavor='草莓',ingredients=[],mix=0,topping=[],count=Number(localStorage.getItem('cakeCount')||0),timer=null;const $=id=>document.getElementById(id);function say(t){$('speech').textContent=t}function msg(t){$('message').textContent=t}function btn(t,fn){let b=document.createElement('button');b.textContent=t;b.onclick=fn;$('options').append(b);return b}function next(){step++;render()}function advance(t){msg(t);$('next').style.display='inline-block';$('next').onclick=next}function render(){clearInterval(timer);$('options').innerHTML='';$('next').style.display='none';msg('');$('progress').innerHTML=steps.map((s,i)=>'<span class="step '+(i===step?'on':'')+'">'+(i+1)+'. '+s+'</span>').join('');$('stars').textContent='⭐ 已做出 '+count+' 个蛋糕';$('heading').textContent=steps[step];if(step===0){$('cake').textContent='🥣';$('instruction').textContent='你想做什么口味的蛋糕？';say('汪汪！毛毛虫，我们来做蛋糕吧！');['🍓 草莓','🍫 巧克力','🍋 柠檬','🫐 蓝莓'].forEach(x=>btn(x,()=>{flavor=x;step=1;render()}))}if(step===1){$('cake').textContent='🥚';$('instruction').textContent='找到做蛋糕需要的 3 种材料！';say('毛毛虫：先把材料放进碗里！');['🥚 鸡蛋','🌾 面粉','🥛 牛奶','🧦 袜子','🧸 玩具熊'].forEach(x=>{let b=btn(x,()=>{if(['🥚 鸡蛋','🌾 面粉','🥛 牛奶'].includes(x)){if(!ingredients.includes(x)){ingredients.push(x);b.classList.add('selected');b.disabled=true;msg('已加入 '+ingredients.length+'/3 种材料！')}if(ingredients.length===3)advance('材料准备好了！ ⭐')}else{msg('哎呀，这个不能放进蛋糕里！再试试～');say('柴犬：这个不是食材哦！')}})});if(ingredients.length===3)advance('材料准备好了！')}if(step===2){$('cake').textContent='🥣';$('instruction').textContent='连续点击搅拌按钮 6 次！';say('柴犬：一起把面糊搅拌均匀！');btn('🥄 搅拌！',()=>{mix++;$('cake').textContent=mix%2?'🌀':'🥣';msg('搅拌 '+Math.min(mix,6)+'/6 次');if(mix>=6){$('options').innerHTML='';$('cake').textContent='🧁';advance('面糊搅拌好啦！')}})}if(step===3){$('cake').textContent='🔥';$('instruction').textContent='点击开始烘烤，等倒计时结束！';say('毛毛虫：闻起来好香呀！');btn('🔥 开始烘烤',()=>{$('options').innerHTML='';let left=5;msg('烘烤中……'+left+' 秒');timer=setInterval(()=>{left--;msg('烘烤中……'+left+' 秒');if(left<=0){clearInterval(timer);$('cake').textContent='🎂';advance('叮！蛋糕烤好了！')}},1000)})}if(step===4){$('cake').textContent='🎂';$('instruction').textContent='选 2 种装饰，让蛋糕更漂亮！';say('柴犬：最后来装饰蛋糕！');['🍓 草莓','🍒 樱桃','🍬 糖果','🫐 蓝莓','🌈 彩虹糖'].forEach(x=>{let b=btn(x,()=>{if(topping.includes(x))return;topping.push(x);b.disabled=true;b.classList.add('selected');msg('已选装饰：'+topping.join(' + '));if(topping.length===2)advance('漂亮的蛋糕完成啦！')})})}if(step===5){$('cake').textContent='🎂';count++;localStorage.setItem('cakeCount',count);$('stars').textContent='⭐ 已做出 '+count+' 个蛋糕';$('instruction').textContent='恭喜！你和柴犬、毛毛虫做出了 '+flavor+'蛋糕，装饰有 '+topping.join('、')+'！';say('柴犬：汪！太棒啦！ 毛毛虫：好好吃！');btn('🎉 再做一个蛋糕',()=>{step=0;ingredients=[];mix=0;topping=[];render()});if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance('太棒啦！蛋糕完成了！');u.lang='zh-CN';u.rate=.9;speechSynthesis.speak(u)}}}$('reset').onclick=()=>{clearInterval(timer);step=0;ingredients=[];mix=0;topping=[];render()};render();</script></body></html>

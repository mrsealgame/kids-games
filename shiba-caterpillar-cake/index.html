function start(n){document.querySelector('.finish-overlay')?.remove();$('oven').dataset.cooked='';clearInterval(ovenInterval);level=n;added=[];stirs=0;foam=0;ovenLoaded=false;phase=n===1?'ingredients':'egg';draw()}function ingredientDrop(k){sound(k==='egg'?'egg':'pick');if(phase==='egg'&&k==='egg'){phase='whisk';draw();return}if(phase==='ingredients'&&!added.includes(k)&&['flour','water','milk'].includes(k)){added.push(k);const needed=level===3?3:2;if(added.length===needed){phase='stir';stirs=0}draw()}if(phase==='pour'&&k==='mold'){phase='mold';draw()}}function stirOnce(){sound('stir');if(phase!=='whisk'&&phase!=='stir')return;const bowl=$('bowl');bowl.classList.remove('shaking');void bowl.offsetWidth;bowl.classList.add('shaking');if(phase==='whisk'){foam++;if(foam>=3){phase='ingredients';added=[];setTimeout(draw,390)}else{const n=bowl.querySelector('.countdown');if(n)n.textContent=3-foam}}else{stirs++;if(stirs>=3){phase='oven';setTimeout(draw,390)}else{const n=bowl.querySelector('.countdown');if(n)n.textContent=3-stirs}}} 
function beginBake(){if(!ovenLoaded)return;sound('fire');$('oven').dataset.cooked='';phase='baking';ovenStart=Date.now();draw();$('oven').classList.add('ovenGlow');setText('Baking…','');ovenInterval=setInterval(()=>{let t=(Date.now()-ovenStart)/1000;let bar=$('bar');if(bar){bar.style.width=Math.min(t/9*100,100)+'%';bar.style.background=t>=9?'#b66d5c':t>=5?'#b8c893':'#e9b66f'}if(t>=9){clearInterval(ovenInterval);phase='burned';sound('fail');$('oven').classList.remove('ovenGlow');draw();showBurned()}else if(t>=5){phase='ready';sound('ready');setText('Ready! Take it out before it burns!','');if(!$('oven').dataset.cooked){$('oven').dataset.cooked='1';$('oven').querySelector('svg').outerHTML=ovenWithCake('on',true)}}} ,90)}function burnedCakeSvg(){return svg(`<ellipse cx="80" cy="132" rx="67" ry="13" fill="#9b8b7c"/><path d="M27 87Q25 49 80 48T133 87V116Q80 140 27 116Z" fill="#302b2a" stroke="#18191a" stroke-width="4"/><ellipse cx="80" cy="85" rx="53" ry="26" fill="#423b38" stroke="#211e1c" stroke-width="4"/><path d="M46 78q11-13 24 0t24 0t20 0" fill="none" stroke="#66564a" stroke-width="4"/><path d="M60 41q-11-13 0-25m20 21q-9-13 1-27m18 31q-8-14 2-26" fill="none" stroke="#aaa39a" stroke-width="3" opacity=".8" stroke-linecap="round"/>`)}
function ovenWithBurnedCake(){return ovenSvg('off').replace('</svg>',`<g pointer-events="none"><path d="M49 99Q80 77 111 99L107 117Q80 128 53 117Z" fill="#292522" stroke="#161616" stroke-width="2"/><ellipse cx="80" cy="99" rx="32" ry="9" fill="#413630"/></g></svg>`)}
function showBurned(){document.querySelector('.finish-overlay')?.remove();let overlay=document.createElement('div');overlay.className='finish-overlay';overlay.innerHTML='<div class="finish-card">'+burnedCakeSvg()+'<h2>Oh no! The cake burned!</h2><p>Try Again!</p><button id="burnRetry">Retry</button></div>';document.body.append(overlay);overlay.querySelector('#burnRetry').onclick=()=>start(level)}
function finishedCakeSvg(){return svg(`<ellipse cx="80" cy="132" rx="65" ry="13" fill="#c9a78b"/><path d="M27 87Q25 49 80 48T133 87V116Q80 140 27 116Z" fill="#d4a26a" stroke="#a8764d" stroke-width="4"/><ellipse cx="80" cy="85" rx="53" ry="26" fill="#f1d5a0" stroke="#bd8d60" stroke-width="4"/><path d="M45 82q12-12 24 0t24 0t22 0" fill="none" stroke="#e5b780" stroke-width="4"/>`)}function showFinish(){document.querySelector('.finish-overlay')?.remove();let overlay=document.createElement('div');overlay.className='finish-overlay';let name=['','Traditional Flatbread','Sponge Cake','Milk Sponge Cake'][level];overlay.innerHTML='<div class="finish-card">'+finishedCakeSvg()+'<h2>'+name+'！ Complete!</h2>'+(level===3?'<button class="lock-next" id="finishClose" aria-label="Next level is locked"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="16" r="1.5"/></svg></button><p class="lock-note">Next level is locked</p>':'<button id="finishClose">Next Level</button>')+'</div>';document.body.append(overlay);overlay.querySelector('#finishClose').onclick=()=>{if(level===3){sound('lock');let b=overlay.querySelector('#finishClose');b.classList.remove('lock-shake');void b.offsetWidth;b.classList.add('lock-shake');return}sound('tap');overlay.remove();start(level+1)}}function success(){sound('success');clearInterval(ovenInterval);$('oven').classList.remove('ovenGlow');phase='done';if(level>=unlocked&&level<3){unlocked=level+1;localStorage.setItem('cakeUnlocked',unlocked)}draw();showFinish()}
function hit(e,id){let r=$(id).getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}document.addEventListener('pointerdown',e=>{if(phase==='oven'&&!ovenLoaded&&e.target.closest('#bowl')){drag={kind:'batter'};let g=document.createElement('div');g.className='dragghost';g.innerHTML=bowlSvg('batter');document.body.append(g);drag.ghost=g;move(e);e.preventDefault();return}let item=e.target.closest('.ingredient');if(item&&!item.classList.contains('used')){drag={kind:item.dataset.item,source:item};let g=document.createElement('div');g.className='dragghost';g.innerHTML=icons[drag.kind];document.body.append(g);drag.ghost=g;move(e);e.preventDefault();return}if((['ready','baking'].includes(phase)&&e.target.closest('#oven')&&(Date.now()-ovenStart)>=5000)){drag={kind:'cake'};let g=document.createElement('div');g.className='dragghost';g.innerHTML=icons.mold;document.body.append(g);drag.ghost=g;move(e);e.preventDefault();return}});function move(e){if(!drag)return;if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}if(drag.kind==='stir'&&hit(e,'bowl')){let r=$('bowl').getBoundingClientRect(),a=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);if(lastAngle!==null){let d=Math.abs(a-lastAngle);stroke+=Math.min(d>Math.PI?2*Math.PI-d:d,.65)}if(['whisk','stir'].includes(phase)){whiskAngle+=Math.min(dSafe(lastAngle,a),.65)*180/Math.PI;let w=$('bowl').querySelector('.whisk');if(w){let bowlArt=$('bowl').querySelector('svg');let artRect=bowlArt.getBoundingClientRect();let dx=(e.clientX-(artRect.left+artRect.width*.5))/artRect.width*160;let dy=(e.clientY-(artRect.top+artRect.height*.4))/artRect.height*160;w.setAttribute('transform','translate('+Math.max(-13,Math.min(13,dx*.32)).toFixed(1)+' '+Math.max(-5,Math.min(5,dy*.22)).toFixed(1)+')')}lastAngle=a;if(stroke>=Math.PI*2){stroke=0;if(phase==='whisk'){foam++;if(foam>=6){phase='ingredients';added=[]}}else{stirs++;if(stirs>=3)phase='oven'}draw()}}}}function dSafe(prev,cur){if(prev===null)return 0;let d=Math.abs(cur-prev);return d>Math.PI?2*Math.PI-d:d}document.addEventListener('pointermove',move);document.addEventListener('pointerup',e=>{if(!drag)return;let k=drag.kind;if(drag.ghost)drag.ghost.remove();drag=null;if(k==='batter'&&phase==='oven'&&hit(e,'oven')){ovenLoaded=true;sound('pick');draw()}else if(['flour','water','egg','milk','mold'].includes(k)&&hit(e,'bowl'))ingredientDrop(k);else if(k==='cake'&&hit(e,'plate')&&(Date.now()-ovenStart)<9000)success()});start(1);

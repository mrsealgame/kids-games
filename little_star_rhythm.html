<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Little Star Rhythm</title><style>body{margin:0;background:linear-gradient(#101b49,#273b70);color:#fff;font-family:system-ui;text-align:center}main{max-width:780px;margin:auto;padding:16px}h1{font-size:26px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;margin:4px;background:#ffdb8b;color:#263353}button:disabled{opacity:.45}#sheet{width:100%;background:#fff9ec;border-radius:18px;margin:15px auto}#keys{display:flex;justify-content:center;height:175px;touch-action:manipulation} .key{flex:1;max-width:85px;border:2px solid #69738b;background:#fff;color:#333;border-radius:0 0 12px 12px;display:flex;align-items:end;justify-content:center;padding-bottom:16px;box-sizing:border-box;font-weight:bold}.key:active,.key.hit{background:#ffe48e}#status{min-height:48px;font-size:21px;font-weight:bold}#score{margin:10px}select{font-size:17px;padding:9px;border-radius:8px}small{color:#d5defb}#legend{font-size:14px}</style></head><body><main><h1>🌟 Little Star Rhythm 🎹</h1><p>看五线谱，听节拍，按时弹琴！</p><div><label>速度 <select id="tempo"><option value="60">🐢 60 BPM</option><option value="80" selected>🐰 80 BPM</option></select></label><button id="start">▶ 开始挑战</button><button id="demo">♫ 听示范</button><button id="stop">■ 停止</button></div><canvas id="sheet" width="760" height="245"></canvas><div id="legend">高音谱号 · C大调 · 4/4拍 · 每次显示两小节</div><p id="status">点击「开始挑战」，先听 4 拍预备节拍。</p><div id="score">🌟 Perfect 0　⭐ Good 0　🎵 Miss 0</div><div id="keys"></div><small>使用屏幕钢琴弹奏；每个音符在对应拍点附近按下。最后一拍的长音只需按一次。</small></main><script>
const notes=[['C',1],['C',1],['G',1],['G',1],['A',1],['A',1],['G',2],['F',1],['F',1],['E',1],['E',1],['D',1],['D',1],['C',2],['G',1],['G',1],['F',1],['F',1],['E',1],['E',1],['D',2],['G',1],['G',1],['F',1],['F',1],['E',1],['E',1],['D',2],['C',1],['C',1],['G',1],['G',1],['A',1],['A',1],['G',2],['F',1],['F',1],['E',1],['E',1],['D',1],['D',1],['C',2]];
const freq={C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:493.88,c:523.25};const names=['C','D','E','F','G','A','B','c'];const canvas=document.getElementById('sheet'),ctx=canvas.getContext('2d');let audio,playing=false,timers=[],startAt=0,beat=750,expected=0,results=[],mode='';const offsets=[];let t=0;notes.forEach(n=>{offsets.push(t);t+=n[1]});
function getAudio(){audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();return audio}function sound(note,dur=.28,when){const a=getAudio(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=freq[note];const st=when??a.currentTime;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.19,st+.015);g.gain.exponentialRampToValueAtTime(.0001,st+dur);o.start(st);o.stop(st+dur+.02)}function clickSound(when){let a=getAudio(),o=a.createOscillator(),g=a.createGain();o.frequency.value=900;o.type='sine';o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.09,when);g.gain.exponentialRampToValueAtTime(.001,when+.055);o.start(when);o.stop(when+.06)}
const keybox=document.getElementById('keys');names.forEach(n=>{const b=document.createElement('button');b.className='key';b.textContent=n==='c'?'C5':n+'4';b.onpointerdown=e=>{e.preventDefault();sound(n);b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),130);judge(n)};keybox.appendChild(b)});
function draw(){ctx.clearRect(0,0,760,245);ctx.fillStyle='#fff9ec';ctx.fillRect(0,0,760,245);ctx.strokeStyle='#424d64';ctx.lineWidth=1.5;for(let i=0;i<5;i++){let y=77+i*22;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(732,y);ctx.stroke()}ctx.fillStyle='#263353';ctx.font='68px serif';ctx.fillText('𝄞',36,162);ctx.font='20px serif';ctx.fillText('4',94,111);ctx.fillText('4',94,150);let group=Math.floor(expected/8),lo=group*8,hi=Math.min(lo+8,notes.length);let x=137;for(let i=lo;i<hi;i++){let [n,d]=notes[i],y={C:187,D:176,E:165,F:154,G:143,A:132,B:121,c:110}[n];if(i===expected&&playing&&mode==='play'){ctx.fillStyle='#fff0b0';ctx.fillRect(x-18,65,42,137)}ctx.save();ctx.translate(x,y);ctx.rotate(-.25);ctx.fillStyle=i===expected&&playing&&mode==='play'?'#e88b20':'#283954';ctx.beginPath();ctx.ellipse(0,0,10,7,0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.strokeStyle='#283954';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+9,y);ctx.lineTo(x+9,y-46);ctx.stroke();if(n==='C'){ctx.beginPath();ctx.moveTo(x-15,187);ctx.lineTo(x+15,187);ctx.stroke()}if(d===2){ctx.fillStyle='#fff9ec';ctx.beginPath();ctx.ellipse(x,y,6,4, -.25,0,Math.PI*2);ctx.fill()}if((i-lo===3)||(i-lo===6)){ctx.strokeStyle='#999';ctx.beginPath();ctx.moveTo(x+31,75);ctx.lineTo(x+31,165);ctx.stroke()}x+=72}ctx.font='15px system-ui';ctx.fillStyle='#65718d';ctx.fillText('♪ 第 '+(Math.floor(lo/8)+1)+' 段 / '+Math.ceil(notes.length/8),35,225)}
function clear(){timers.forEach(clearTimeout);timers=[];playing=false;mode='';expected=0;results=[];draw()}function schedule(fn,ms){timers.push(setTimeout(fn,Math.max(0,ms)))}function update(){let p=results.filter(x=>x==='Perfect').length,g=results.filter(x=>x==='Good').length,m=results.filter(x=>x==='Miss').length;document.getElementById('score').textContent=`🌟 Perfect ${p}　⭐ Good ${g}　🎵 Miss ${m}`}
function begin(demo){clear();getAudio();playing=true;mode=demo?'demo':'play';beat=60000/+document.getElementById('tempo').value;const now=audio.currentTime;for(let k=0;k<4;k++){clickSound(now+.15+k*beat/1000);schedule(()=>document.getElementById('status').textContent='预备拍：'+(k+1)+' / 4',150+k*beat)}startAt=performance.now()+150+4*beat;document.getElementById('status').textContent='准备好！';notes.forEach(([n,d],i)=>{let at=150+(4+offsets[i])*beat;if(demo){schedule(()=>{expected=i;draw();sound(n,Math.max(.22,d*beat/1000*.8));document.getElementById('status').textContent='🎵 示范演奏中…'},at)}else{schedule(()=>{if(i>=expected){for(let j=expected;j<=i;j++)results[j]='Miss';expected=i+1;update();draw();document.getElementById('status').textContent='🎵 没关系，跟上下一拍！'}},at+beat*.46)}});schedule(()=>{playing=false;mode='';expected=0;draw();document.getElementById('status').textContent=demo?'🎶 示范结束，轮到你啦！':`🎉 完成！Perfect ${results.filter(x=>x==='Perfect').length} 个，Good ${results.filter(x=>x==='Good').length} 个！`},150+(4+t)*beat+250);draw()}
function judge(n){if(!playing||mode!=='play')return;let elapsed=performance.now()-startAt;let index=expected;if(index>=notes.length)return;let delta=elapsed-offsets[index]*beat;if(delta< -beat*.45)return;if(delta>beat*.46)return;if(n!==notes[index][0]){document.getElementById('status').textContent='🎵 音高不对，再试试！';return}let quality=Math.abs(delta)<beat*.17?'Perfect':'Good';results[index]=quality;expected++;document.getElementById('status').textContent=(quality==='Perfect'?'🌟 Perfect!':'⭐ Good!')+' 继续加油！';update();draw()}
document.getElementById('start').onclick=()=>begin(false);document.getElementById('demo').onclick=()=>begin(true);document.getElementById('stop').onclick=()=>{clear();document.getElementById('status').textContent='已停止，可以重新开始。'};draw();
</script></body></html>
